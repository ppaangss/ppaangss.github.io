---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="post-meta mono">
      {% if page.categories.size > 0 %}<span class="post-cat">{{ page.categories | join: " › " }}</span><span class="dot">·</span>{% endif %}
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
    </p>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>
  <nav class="toc" hidden>
    <span class="label">목차</span>
  </nav>
  <div class="post-body">
    {{ content }}
  </div>
  {% if page.tags.size > 0 %}
  <div class="post-tags">
    {% for t in page.tags %}
    <a class="tag" href="{{ '/posts/' | relative_url }}?tag={{ t | url_encode }}">#{{ t }}</a>
    {% endfor %}
  </div>
  {% endif %}
</article>
<script>
document.addEventListener('DOMContentLoaded', function () {
  // img-row: 각 사진의 너비를 가로세로 비율에 비례해 배분해서 한 줄의 높이를 맞춘다
  document.querySelectorAll('.post-body .img-row img').forEach(function (img) {
    function fit() {
      if (img.naturalWidth && img.naturalHeight) {
        img.style.flex = (img.naturalWidth / img.naturalHeight) + ' 1 0%';
      }
    }
    if (img.complete) fit(); else img.addEventListener('load', fit);
  });

  var body = document.querySelector('.post-body');
  var toc = document.querySelector('.toc');
  if (!body || !toc) return;
  var heads = body.querySelectorAll('h2[id], h3[id]');
  if (heads.length < 2) return;
  var list = document.createElement('ol');
  heads.forEach(function (h) {
    var li = document.createElement('li');
    if (h.tagName === 'H3') li.className = 'toc-sub';
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    list.appendChild(li);
  });
  toc.appendChild(list);
  toc.hidden = false;
});
</script>
